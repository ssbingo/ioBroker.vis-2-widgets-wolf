version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # monatlich, aber über den Monat verteilt statt am Monatsersten (Repochecker S8906)
    schedule:
      interval: cron
      cronjob: "17 6 5 * *"
      timezone: Europe/Berlin
    # neue Versionen erst nach 7 Tagen übernehmen — weniger Risiko durch kompromittierte Pakete
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - ssbingo
    versioning-strategy: increase
    ignore:
      # @types/node folgt der kleinsten unterstützten Node.js-Version, nicht der neuesten
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Ausnahmen laut CLAUDE.md: typescript-eslint unterstützt TypeScript 7 noch nicht,
      # eslint-plugin-react noch nicht ESLint 10 — Majors erst nach Freigabe von Hand
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/src-widgets-ts"
    schedule:
      interval: cron
      cronjob: "43 7 12 * *"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - ssbingo
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "26 5 19 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - ssbingo
